name: Reusable Docker Build & Push

on:
  workflow_call:
    inputs:
      image_name:
        description: Docker image name
        required: true
        type: string

      context:
        description: Docker build context
        required: true
        type: string

      dockerfile:
        description: Dockerfile path
        required: false
        default: Dockerfile
        type: string

      tag:
        description: Image tag
        required: false
        default: latest
        type: string

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          load: true
          push: false
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}:${{ inputs.tag }}

      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}:${{ inputs.tag }}
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Push Docker Image
        if: success()
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}:${{ inputs.tag }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}:latest

      - name: Docker Summary
        run: |
          echo "# 🐳 Docker Security Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Docker image built" >> $GITHUB_STEP_SUMMARY
          echo "✅ Trivy vulnerability scan passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Docker image pushed" >> $GITHUB_STEP_SUMMARY